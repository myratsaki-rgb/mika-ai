name: Compilar Mika v0.4 - Visual fiel
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Instalar Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verificar pacote v0.4
        run: test -f MIKA_Android_v0.4_FielAoConceito_FONTE.zip
      - name: Extrair projeto
        run: unzip -q MIKA_Android_v0.4_FielAoConceito_FONTE.zip
      - name: Compilar APK
        run: cd MIKA_Android_v0.4_FielAoConceito && gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Mika-PixelHD-v04-APK
          path: MIKA_Android_v0.4_FielAoConceito/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
