name: Compilar Mika Pixel HD v0.7

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Instalar SDK Android
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verificar arquivo fonte
        run: test -f MIKA_Android_v0.7_PixelHD_Viva_FONTE.zip
      - name: Extrair projeto
        run: unzip -q MIKA_Android_v0.7_PixelHD_Viva_FONTE.zip
      - name: Validar recursos visuais
        run: python3 MIKA_Android_v0.7_PixelHD_Viva/scripts/verificar_assets.py
      - name: Compilar APK
        working-directory: MIKA_Android_v0.7_PixelHD_Viva
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Mika-PixelHD-v07-APK
          path: MIKA_Android_v0.7_PixelHD_Viva/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
